name: Publish awesomecua.com

on:
  schedule:
    - cron: '10,40 * * * *'
      timezone: UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      deployments: read
    outputs:
      publish: ${{ steps.version.outputs.publish || 'false' }}
      source_commit: ${{ steps.decision.outputs.source_commit }}
    steps:
      - name: Compare the source head with the published revision
        id: decision
        run: |
          source=$(git ls-remote https://github.com/reacher-z/Awesome-CUA.git refs/heads/main | cut -f1)
          printf '%s\n' "$source" | grep -Eqx '[0-9a-f]{40}' || { echo '::error::Could not read the source head'; exit 1; }
          live=$(curl -fsSL --max-time 20 https://awesomecua.com/data/build-info.json 2>/dev/null | jq -r '.source_commit // empty' || true)
          publish=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$live" = "$source" ]; then publish=false; fi
          printf 'publish=%s\nsource_commit=%s\n' "$publish" "$source" >> "$GITHUB_OUTPUT"
      # GitHub Pages identifies a deployment by the commit the run started from. A second deployment from
      # the same commit reports the first one's success at once and may never replace the live files, so a
      # run whose commit was already deployed records the source commit in publication.txt and starts a
      # fresh run from that new commit.
      - name: Start from a commit that has not been deployed
        id: version
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.decision.outputs.source_commit }}
        run: |
          used=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=github-pages&per_page=1" --jq length)
          if [ "$used" = 0 ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_TRIGGERING_ACTOR" = 'github-actions[bot]' ]; then
            echo "::error::$GITHUB_SHA was already deployed, and this run was started from a recorded publication"; exit 1
          fi
          args=(-X PUT "repos/$GITHUB_REPOSITORY/contents/publication.txt" -f branch="$GITHUB_REF_NAME"
            -f message="Publish source commit ${SOURCE_COMMIT:0:12}"
            -f content="$(printf 'source_commit=%s\nrequested_by_run=%s\n' "$SOURCE_COMMIT" "$GITHUB_RUN_ID" | base64 -w0)")
          previous=$(gh api "repos/$GITHUB_REPOSITORY/contents/publication.txt?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          ! printf '%s\n' "$previous" | grep -Eqx '[0-9a-f]{40}' || args+=(-f sha="$previous")
          gh api "${args[@]}" --jq '"Recorded the publication as " + .commit.sha'
          gh workflow run publish.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
          echo 'publish=false' >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: reacher-z/Awesome-CUA
          ref: ${{ needs.gate.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Read repository star counts
        id: stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars='{}'
          for repo in TIGER-AI-Lab/WebsiteBench TIGER-AI-Lab/ClawBench reacher-z/Awesome-CUA reacher-z/Awesome-REA; do
            count=$(gh api "repos/$repo" --jq .stargazers_count 2>/dev/null) || continue
            stars=$(jq -c --arg repo "$repo" --argjson count "$count" '. + {($repo): $count}' <<<"$stars")
          done
          echo "json=$stars" >> "$GITHUB_OUTPUT"
      - name: Build the website
        env:
          AWESOMECUA_REPO_STARS: ${{ steps.stars.outputs.json }}
        run: python scripts/build_site.py
      - name: Record the source revision
        env:
          CUA_SOURCE_SHA: ${{ needs.gate.outputs.source_commit }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          info={'source_repository':'https://github.com/reacher-z/Awesome-CUA','source_commit':os.environ['CUA_SOURCE_SHA'],'publication_run':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}
          Path('dist/site/data/build-info.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # Large file syncs have taken longer than the 10-minute default, which cancels the deployment.
          timeout: 1500000
